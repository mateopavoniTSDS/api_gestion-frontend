<h2>{{ titulo }}</h2>

<a routerLink="/home/users/new">Nuevo usuario</a>
<a routerLink="/home" [queryParams]="{ sort: 'name' }">Ordenar por nombre</a>
<a routerLink="/home">Sin orden</a>

<div>
  <label>Filtrar por nombre</label>
  <input [formControl]="filterControl">
</div>

<form (ngSubmit)="searchById()">
  <label>Buscar por id</label>
  <input type="number" name="id" [(ngModel)]="searchId">
  <button type="submit" [disabled]="!searchId">Buscar</button>
</form>

<ul>
  @for (user of (users$ | async) ?? []; track user.id) {
    <li>
      <a [routerLink]="['/home/users', user.id]">{{ user.name }}</a>
      - DNI {{ user.dni }} - {{ user.age }} años - {{ user.email }}
    </li>
  }
</ul>
