@if (error()) {
  <p class="error">{{ error() }}</p>
}

@if (user(); as u) {
  <h2>{{ u.name }}</h2>
  <p>DNI: {{ u.dni }}</p>
  <p>Email: {{ u.email }}</p>
  <p>Rol: {{ u.roleType === 1 ? 'Admin' : 'User' }}</p>
}

@if (user(); as u) {
  <a [routerLink]="['/home/users', u.id, 'edit']">Editar</a>
}
<a routerLink="/home">Volver</a>
